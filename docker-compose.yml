services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      APP_ENV: docker
      LOG_LEVEL: INFO
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-false}
      SEED_DATABASE: ${SEED_DATABASE:-true}
      RESET_SEED_MANAGER_PASSWORD: ${RESET_SEED_MANAGER_PASSWORD:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DEV_MANAGER_EMAIL: ${DEV_MANAGER_EMAIL:?Set DEV_MANAGER_EMAIL in .env}
      DEV_MANAGER_PASSWORD: ${DEV_MANAGER_PASSWORD:?Set DEV_MANAGER_PASSWORD in .env}
      ML_MODEL_PATH: ${ML_MODEL_PATH:-backend/ml/artifacts/risk_model.joblib}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_COLLECTION_NAME: ${RAG_COLLECTION_NAME:-hotel_retention_policy}
      RAG_PERSIST_DIRECTORY: ${RAG_PERSIST_DIRECTORY:-/var/lib/hotel/rag_store}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      RAG_POLICY_DOCUMENT_PATH: ${RAG_POLICY_DOCUMENT_PATH:-data/policy/Company_Retention_Policy_2026.pdf}
      LANGGRAPH_CHECKPOINT_PATH: ${LANGGRAPH_CHECKPOINT_PATH:-/var/lib/hotel/langgraph/checkpoints.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${CUSTOMER_FRONTEND_PORT:-8080},http://localhost:${MANAGER_FRONTEND_PORT:-8081}}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NL_SQL_LLM_ENABLED: ${NL_SQL_LLM_ENABLED:-false}
      NL_SQL_LLM_MODEL: ${NL_SQL_LLM_MODEL:-openai/gpt-oss-20b}
    volumes:
      - rag_data:/var/lib/hotel/rag_store
      - langgraph_data:/var/lib/hotel/langgraph
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  customer-frontend:
    build:
      context: ./frontend/customer
      args:
        VITE_API_BASE_URL: ${CUSTOMER_API_BASE_URL:-}
    ports:
      - "${CUSTOMER_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  manager-frontend:
    build:
      context: ./frontend/manager
      args:
        VITE_API_BASE_URL: ${MANAGER_API_BASE_URL:-}
    ports:
      - "${MANAGER_FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  rag_data:
  langgraph_data:
